<svg width="300" height="190" viewBox="0 0 300 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleId">
  <title id="titleId">Most Used Languages</title>
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #58A6FF; }
    @supports(-moz-appearance: auto) { .header { font-size: 15.5px; } }
    .lang-name { font: 400 11px "Segoe UI", Ubuntu, Sans-Serif; fill: #C3D1D9; }
  </style>
  <rect data-testid="card-bg" x="0.5" y="0.5" rx="4.5" height="99%" width="299" fill="#0D1117" stroke="#0D1117" stroke-opacity="0"/>
  <g data-testid="card-title" transform="translate(25, 35)">
    <text x="0" y="0" class="header">Most Used Languages</text>
  </g>
  <g data-testid="main-card-body" transform="translate(0, 55)">
    <g transform="translate(25, 0)">
      <mask id="rect-mask">
        <rect x="0" y="0" width="250" height="8" fill="white" rx="5"/>
      </mask>
      <g mask="url(#rect-mask)">
      <rect x="0.00" y="0" width="238.74" height="8" fill="#555555"/>
      <rect x="238.74" y="0" width="4.66" height="8" fill="#f34b7d"/>
      <rect x="243.40" y="0" width="1.62" height="8" fill="#6E4C13"/>
      <rect x="245.03" y="0" width="1.42" height="8" fill="#3572A5"/>
      <rect x="246.45" y="0" width="0.99" height="8" fill="#89e051"/>
      <rect x="247.43" y="0" width="0.82" height="8" fill="#dea584"/>
      <rect x="248.25" y="0" width="0.49" height="8" fill="#427819"/>
      <rect x="248.74" y="0" width="0.40" height="8" fill="#3A4E3A"/>
      </g>
    </g>
    <g transform="translate(25, 25)">
      <g transform="translate(0, 0)">
        <circle cx="5" cy="6" r="5" fill="#555555"/>
        <text x="15" y="10" class="lang-name">C 95.50%</text>
      </g>
      <g transform="translate(0, 25)">
        <circle cx="5" cy="6" r="5" fill="#f34b7d"/>
        <text x="15" y="10" class="lang-name">C++ 1.86%</text>
      </g>
      <g transform="translate(0, 50)">
        <circle cx="5" cy="6" r="5" fill="#6E4C13"/>
        <text x="15" y="10" class="lang-name">Assembly 0.65%</text>
      </g>
      <g transform="translate(0, 75)">
        <circle cx="5" cy="6" r="5" fill="#3572A5"/>
        <text x="15" y="10" class="lang-name">Python 0.57%</text>
      </g>
      <g transform="translate(150, 0)">
        <circle cx="5" cy="6" r="5" fill="#89e051"/>
        <text x="15" y="10" class="lang-name">Shell 0.39%</text>
      </g>
      <g transform="translate(150, 25)">
        <circle cx="5" cy="6" r="5" fill="#dea584"/>
        <text x="15" y="10" class="lang-name">Rust 0.33%</text>
      </g>
      <g transform="translate(150, 50)">
        <circle cx="5" cy="6" r="5" fill="#427819"/>
        <text x="15" y="10" class="lang-name">Makefile 0.20%</text>
      </g>
      <g transform="translate(150, 75)">
        <circle cx="5" cy="6" r="5" fill="#3A4E3A"/>
        <text x="15" y="10" class="lang-name">Cuda 0.16%</text>
      </g>
    </g>
  </g>
</svg>
